name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    name: Build and Test
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "**/*.{ts,tsx,md}" || echo "Prettier check failed (non-blocking for now)"

        # Run linting
      - name: Lint
        run: npm run lint

        # Type check
      - name: Type check
        run: npx tsc --noEmit

        # Generate Prisma client (no DB connection needed)
      - name: Generate Prisma client
        run: npx prisma generate

        # Build Next.js (db push is skipped; Vercel handles schema sync)
      - name: Build
        run: npx next build
        env:
          POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
          POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-secret-for-build
          NEXTAUTH_URL: http://localhost:3000
          ANTHROPIC_API_KEY: sk-ant-placeholder
